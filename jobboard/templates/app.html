<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>岗位看板</title>
<meta name="description" content="聚合公开招聘信息的看板：按匹配度、方向、地区、发布时间筛选，只显示摘要和原帖链接。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%278%27 fill=%27%230f766e%27/%3E%3Ctext x=%2716%27 y=%2722%27 font-size=%2718%27 text-anchor=%27middle%27 fill=%27white%27%3E%E2%9C%A6%3C/text%3E%3C/svg%3E">
<style>
/* ======== v4 design system (Stitch "Kinetic Board"): warm-gray surfaces, one teal accent, hairline borders ======== */
:root{
  --bg:#f9f9f7;--panel:#fff;--panel2:#f4f4f2;--panel3:#ececea;--fg:#1a1c1b;--fg2:#3d4947;--mut:#68716f;--line:#e5e5e2;--line2:#d4d4d0;
  --ac:#0d9488;--ac2:#00685f;--acsoft:#e3f4f1;--acline:#a7ddd6;--acfg:#fff;--ok:#047857;--oksoft:#dcf3ea;
  --warn:#b45309;--warnbg:#fff6ea;--warnline:#f6d6ae;--star:#d97706;
  --shadow:0 1px 2px rgba(23,23,23,.04);--pop:0 4px 14px -4px rgba(23,23,23,.10);--float:0 18px 48px -12px rgba(23,23,23,.22);
  --r:14px;--side:240px;--detail:420px;
  --t-flutter:#0284c7;--t-ios:#475569;--t-android:#16a34a;--t-mobile:#0d9488;--t-frontend:#ea580c;--t-fullstack:#4f46e5;
  --font:Inter,ui-sans-serif,system-ui,-apple-system,"SF Pro Text","PingFang SC","Noto Sans SC","Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1011;--panel:#15181a;--panel2:#1b1f21;--panel3:#232829;--fg:#e7e9e8;--fg2:#c3cac8;--mut:#929c9a;--line:#262b2d;--line2:#353b3d;
  --ac:#2dd4bf;--ac2:#5eead4;--acsoft:#11302c;--acline:#1f5a52;--acfg:#04201c;--ok:#34d399;--oksoft:#0f2e22;
  --warn:#fbbf24;--warnbg:#261d0c;--warnline:#4a3a17;--star:#fbbf24;
  --shadow:none;--pop:0 6px 18px -6px rgba(0,0,0,.6);--float:0 20px 50px -12px rgba(0,0,0,.75);}}
:root[data-theme="dark"]{
  --bg:#0e1011;--panel:#15181a;--panel2:#1b1f21;--panel3:#232829;--fg:#e7e9e8;--fg2:#c3cac8;--mut:#929c9a;--line:#262b2d;--line2:#353b3d;
  --ac:#2dd4bf;--ac2:#5eead4;--acsoft:#11302c;--acline:#1f5a52;--acfg:#04201c;--ok:#34d399;--oksoft:#0f2e22;
  --warn:#fbbf24;--warnbg:#261d0c;--warnline:#4a3a17;--star:#fbbf24;
  --shadow:none;--pop:0 6px 18px -6px rgba(0,0,0,.6);--float:0 20px 50px -12px rgba(0,0,0,.75);}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.55 var(--font);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;letter-spacing:-.003em}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
svg.i{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px;border-radius:8px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
.app{display:grid;grid-template-columns:var(--side) minmax(0,1fr);min-height:100vh}
body.side-collapsed{--side:60px}

/* ---------- sidebar: filters ---------- */
aside{background:var(--panel);border-right:1px solid var(--line);padding:16px 14px 32px;position:sticky;top:0;height:100vh;overflow:auto;overflow-x:hidden;scrollbar-width:thin;scrollbar-color:var(--line2) transparent}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px;margin:0 2px 6px;letter-spacing:-.01em;line-height:1.25}
.bname{min-width:0;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.logo{width:32px;height:32px;border-radius:9px;background:var(--ac);display:grid;place-items:center;color:var(--acfg);flex:none}
.logo svg{width:18px;height:18px}
.brand .sidetoggle{margin-left:auto;flex:none;border:1px solid var(--line);background:var(--panel);border-radius:8px;width:30px;height:30px;color:var(--mut);display:grid;place-items:center}
.brand .sidetoggle:hover{color:var(--fg);border-color:var(--line2)}
.sec{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:600;color:var(--mut);margin:22px 4px 8px;letter-spacing:.02em}
.sec button{border:0;background:none;color:var(--ac2);font-size:12px;padding:0;font-weight:500}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:none;border-radius:7px;padding:4px 8px;font-size:12.5px;color:var(--mut);white-space:nowrap;min-height:28px}
.seg button:hover{color:var(--fg)}
.seg button.on{background:var(--panel);color:var(--ac2);box-shadow:0 1px 2px rgba(0,0,0,.08),0 0 0 1px var(--line);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chipbtn{border:1px solid var(--line2);background:var(--panel);border-radius:99px;padding:3px 12px;font-size:13px;color:var(--fg);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-height:30px;display:inline-flex;align-items:center;transition:background .12s,border-color .12s,color .12s}
.chipbtn:hover{border-color:var(--ac);color:var(--ac2)}
.chipbtn.on{border-color:var(--ac);color:var(--acfg);background:var(--ac);font-weight:600}
.chipbtn.more-chip{border-style:dashed;color:var(--mut)}
.chipbtn .x{margin-left:6px;opacity:.6}.chipbtn .x:hover{opacity:1}
.switch{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 6px;color:var(--fg);cursor:pointer;border-radius:8px;font-size:13.5px;min-height:34px}
.switch:hover{background:var(--panel2)}
.switch input{appearance:none;width:34px;height:20px;background:var(--line2);border-radius:99px;position:relative;transition:.15s;cursor:pointer;margin:0;flex:none}
.switch input::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.switch input:checked{background:var(--ac)}.switch input:checked::after{left:16px}
.grp{margin-bottom:2px}
.ghead{display:flex;align-items:center;gap:2px}
.ghead .gsel{flex:1;display:flex;justify-content:space-between;align-items:center;border:0;background:none;padding:5px 6px;border-radius:8px;font-weight:600;font-size:13px;text-align:left;min-height:32px}
.ghead .gsel:hover{background:var(--panel2)}.ghead .gsel.on{color:var(--fg)}
.ghead .gsel span{font-weight:500;font-size:12px;color:var(--mut)}
.ghead .chev{border:0;background:none;color:var(--mut);padding:0;border-radius:6px;transition:transform .15s;min-width:24px;min-height:28px;font-size:11px}
.grp.closed .chev{transform:rotate(-90deg)}.grp.closed .rows{display:none}
.rows{display:grid;margin:0 0 6px 2px}
.srow{display:grid;grid-template-columns:18px 1fr auto auto;align-items:center;gap:9px;padding:5px 6px;border-radius:7px;cursor:pointer;color:var(--fg);font-size:13px;user-select:none;min-height:32px}
.srow:hover{background:var(--panel2)}
.srow .chk{width:16px;height:16px;border:1.5px solid var(--line2);border-radius:5px;display:grid;place-items:center;font-size:10px;color:var(--acfg);background:var(--panel)}
.srow.on .chk{background:var(--ac);border-color:var(--ac)}.srow.on .chk::after{content:"✓";font-weight:700}
.srow b{font-weight:400;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srow i{font-style:normal;color:var(--mut);font-size:12px;min-width:18px;text-align:right}
.srow.zero{color:var(--mut)}.srow.zero .chk{opacity:.6}
.srow .ext{color:var(--mut);text-decoration:none;padding:0 4px;border-radius:6px}.srow .ext:hover{color:var(--ac2);background:var(--acsoft)}
.saveq{display:flex;gap:6px;margin:8px 0 0}.saveq input{flex:1;min-width:0;border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:5px 9px;font-size:12.5px}
.saveq button{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:0 10px;font-size:12.5px;color:var(--ac2)}
.hint0{color:var(--mut);font-size:12.5px;padding:0 6px;line-height:1.5}

/* ---------- main column ---------- */
main{min-width:0;padding:0 clamp(16px,2vw,32px) 80px}
.bar{position:sticky;top:0;z-index:6;margin:0 calc(-1*clamp(16px,2vw,32px)) 18px;padding:12px clamp(16px,2vw,32px);background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.search{flex:1;min-width:180px;position:relative}
.search input{width:100%;height:42px;padding:0 44px 0 40px;border:1px solid var(--line);background:var(--panel);border-radius:12px;outline:none;font-size:14.5px;box-shadow:var(--shadow);transition:border-color .12s,box-shadow .12s}
.search input::placeholder{color:var(--mut)}
.search input:focus{border-color:var(--ac);box-shadow:0 0 0 3px var(--acsoft)}
.search svg{position:absolute;left:13px;top:13px;width:16px;height:16px;color:var(--mut)}
.search kbd{position:absolute;right:10px;top:11px}
kbd{font:11px var(--mono);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;color:var(--mut);background:var(--panel2)}
.nextrun{font-size:12.5px;color:var(--mut);display:inline-flex;align-items:center;gap:7px;white-space:nowrap;padding:0 4px}
.nextrun::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ac);box-shadow:0 0 0 3px var(--acsoft)}
.nextrun:empty{display:none}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:10px;height:38px;padding:0 14px;font-weight:600;font-size:13.5px;display:inline-flex;gap:8px;align-items:center;justify-content:center;white-space:nowrap;text-decoration:none;color:var(--fg);transition:border-color .12s,background .12s}
.btn:hover{border-color:var(--line2);background:var(--panel2)}
.btn.p{background:var(--ac);border-color:var(--ac);color:var(--acfg)}.btn.p:hover{filter:brightness(1.06);background:var(--ac)}
.btn.ico{width:38px;padding:0;font-weight:500;color:var(--fg2)}
a.btn.ico{width:auto;padding:0 12px;font-size:13px}
.btn:disabled{opacity:.7;cursor:progress}
.spin{width:13px;height:13px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:r .7s linear infinite;display:none}
.busy .spin{display:inline-block}@keyframes r{to{transform:rotate(360deg)}}
.only-m{display:none}
.stats{display:flex;gap:10px;margin:0 0 16px;flex-wrap:wrap}
.stat{display:flex;align-items:baseline;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 14px;box-shadow:var(--shadow)}
.stat .v{font-size:18px;font-weight:700;letter-spacing:-.02em;order:1}.stat .k{color:var(--mut);font-size:12.5px;order:2}
.filters{display:flex;align-items:center;gap:12px;margin:0 0 14px}
.frow:not(.rolesrow){display:contents}.rolesrow{flex:1;display:flex;align-items:flex-start;gap:12px;min-width:0}
.flabel{font-size:12.5px;font-weight:600;color:var(--mut);white-space:nowrap;padding-top:6px}
.flabel button{border:0;background:none;color:var(--ac2);font-size:12px;margin-left:6px;padding:0;font-weight:500}
.rolesrow .chips{flex:1;min-width:0}
.tabs{display:flex;gap:22px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:8px 0 10px;color:var(--mut);white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px;display:flex;gap:7px;align-items:center;font-size:14px;flex:none}
.tab:hover{color:var(--fg)}.tab.on{color:var(--fg);border-color:var(--ac);font-weight:600}
.tab .n{font-size:11.5px;font-weight:500;color:var(--mut);background:var(--panel3);border-radius:99px;padding:0 7px;line-height:18px}
.tab.on .n{background:var(--acsoft);color:var(--ac2)}
.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px;min-height:34px}
.active{display:flex;gap:6px;flex-wrap:wrap;align-items:center;flex:1;min-width:0}
.af{border:1px solid var(--acline);background:var(--acsoft);color:var(--ac2);border-radius:8px;padding:0 6px 0 10px;height:28px;font-size:12.5px;font-weight:500;display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.af:hover{border-color:var(--ac)}.af span{opacity:.7;font-size:11px}
.clear{border:0;background:none;color:var(--mut);font-size:12.5px;padding:2px 6px;white-space:nowrap}.clear:hover{color:var(--fg)}
.count{color:var(--mut);font-size:13px;white-space:nowrap}
.right{display:flex;gap:8px;align-items:center;margin-left:auto;flex:none}
.right .seg{grid-auto-columns:auto}.right .seg button{padding:3px 12px;min-height:26px}
.right .btn.ico{width:32px;height:32px;border-radius:9px}
.linkbtn{border:0;background:none;color:var(--ac2);font-size:12.5px;padding:2px 4px}

/* ---------- job cards ---------- */
.list{display:grid;gap:10px}
.card{cursor:pointer;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px 14px;display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:0 14px;position:relative;box-shadow:var(--shadow);transition:border-color .12s,box-shadow .12s}
.card:hover{border-color:var(--line2);box-shadow:var(--pop)}
.card.sel{border-color:var(--acline);box-shadow:0 0 0 1px var(--acline),var(--pop)}
.card.sel::after{content:"";position:absolute;left:-1px;top:-1px;bottom:-1px;width:4px;border-radius:var(--r) 0 0 var(--r);background:var(--ac)}
.card.ignored{opacity:.5}
.card.applied::before,.card.replied::before,.card.interested::before{content:"";position:absolute;right:-1px;top:16px;width:3px;height:22px;border-radius:3px 0 0 3px;background:var(--st)}
.card.interested{--st:var(--star)}.card.applied{--st:var(--ok)}.card.replied{--st:var(--ac)}
.av{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;font-weight:700;font-size:15px;color:var(--c);background:color-mix(in srgb,var(--c) 12%,var(--panel));border:1px solid color-mix(in srgb,var(--c) 18%,var(--line))}
.head{min-width:0}
h3{margin:0;font-size:16px;font-weight:650;letter-spacing:-.01em;line-height:1.4;overflow-wrap:anywhere}
h3 .new{display:inline-block;font-size:10.5px;font-weight:700;color:var(--ac2);background:var(--acsoft);border:1px solid var(--acline);border-radius:5px;padding:0 5px;line-height:16px;margin-left:8px;vertical-align:2px;letter-spacing:.04em}
.meta{display:flex;flex-wrap:wrap;gap:2px 0;color:var(--mut);font-size:13.5px;margin-top:3px;align-items:center}
.meta>span{white-space:nowrap}
.meta>span+span::before{content:"·";margin:0 8px;opacity:.6}
.meta>span:first-child:not([class]){color:var(--fg2)}
.meta .sal{color:var(--ok);font-weight:600}.meta .geo{color:var(--warn)}.meta .okg{color:var(--ac2)}
.acts{display:flex;gap:8px;align-items:flex-start}
.sc{font-size:12.5px;font-weight:700;min-width:30px;text-align:center;padding:0 8px;line-height:24px;border-radius:99px;background:var(--acsoft);color:var(--ac2);border:1px solid var(--acline)}
.sc.hi{background:var(--oksoft);color:var(--ok);border-color:color-mix(in srgb,var(--ok) 30%,transparent)}.sc.lo{background:var(--panel2);color:var(--mut);border-color:var(--line)}
.ibtn{border:1px solid transparent;background:none;border-radius:8px;width:30px;height:30px;display:grid;place-items:center;font-size:15px;color:var(--mut);flex:none}
.ibtn:hover{background:var(--panel2);color:var(--fg)}
.card .ibtn[data-st]{margin-top:-3px}
.ibtn.on{color:var(--star)}.ibtn.on:hover{color:var(--star)}
.ibtn svg{width:17px;height:17px}.ibtn.on svg{fill:currentColor}
.stsel{display:none}
.body{grid-column:2/-1;min-width:0}
.foot{display:flex;gap:8px 14px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.tags{display:flex;gap:6px;flex-wrap:wrap;min-width:0}
.tag{font-size:12px;font-weight:500;padding:0 8px 0 7px;border-radius:6px;color:var(--fg2);background:var(--panel2);border:1px solid var(--line);display:inline-flex;align-items:center;gap:5px;line-height:22px;white-space:nowrap}
.tag::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--c,var(--ac))}
.tag.more{color:var(--mut);cursor:help}.tag.more::before{display:none}
.src{display:flex;gap:6px;align-items:center;color:var(--mut);font-size:12.5px;white-space:nowrap;margin-left:auto;min-width:0}
.src .when+*::before{content:"·";margin-right:6px;opacity:.6}
.row{display:flex;gap:6px 8px;flex-wrap:wrap;align-items:center;margin-top:10px;color:var(--mut);font-size:12.5px}
.pill{font-size:12.5px;padding:0;color:var(--mut);text-decoration:none;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
a.pill{color:var(--ac2)}a.pill:hover{text-decoration:underline;text-underline-offset:2px}
.src .pill+.pill::before{content:"·";margin-right:6px;color:var(--mut)}
.cbtn{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:0 10px;height:30px;text-decoration:none;color:var(--fg);font-size:13px;white-space:nowrap}
.cbtn:hover{border-color:var(--ac);color:var(--ac2)}.cbtn.cp{padding:0 8px;color:var(--mut)}
.warn{margin-top:10px;background:var(--warnbg);color:var(--warn);border:1px solid var(--warnline);border-radius:10px;padding:8px 12px;font-size:13px;display:flex;gap:8px;align-items:flex-start;line-height:1.5}
details{margin-top:8px}summary{cursor:pointer;color:var(--mut);font-size:12.5px;list-style:none;width:max-content}summary::before{content:"▸ "}details[open] summary::before{content:"▾ "}
summary:hover{color:var(--ac2)}
pre{white-space:pre-wrap;word-break:break-word;font:inherit;background:var(--panel2);border-radius:8px;padding:10px 12px;margin:8px 0 0;max-height:340px;overflow:auto}
.dense .list{gap:6px}.dense .card{padding:10px 14px;grid-template-columns:32px minmax(0,1fr) auto}.dense .av{width:32px;height:32px;font-size:13px;border-radius:8px}
.dense h3{font-size:14.5px}.dense .meta{font-size:13px;margin-top:1px}.dense .foot{margin-top:8px;padding-top:8px}
.btn.more{display:flex;margin:16px auto 0}
.empty{text-align:center;color:var(--mut);padding:56px 20px;background:var(--panel);border:1px dashed var(--line2);border-radius:var(--r)}
.empty b{display:block;color:var(--fg);font-size:15px;margin-bottom:6px}
.skel{height:118px;border-radius:var(--r);background:linear-gradient(90deg,var(--panel) 25%,var(--panel2) 50%,var(--panel) 75%);background-size:200% 100%;animation:sh 1.2s infinite;border:1px solid var(--line)}
@keyframes sh{to{background-position:-200% 0}}
.dayhead{font-size:12.5px;font-weight:650;color:var(--fg2);margin:12px 4px 0;display:flex;gap:8px;align-items:baseline}.dayhead span{font-weight:400;color:var(--mut);font-size:11.5px}
.list>.dayhead:first-child{margin-top:0}

/* ---------- detail panel: drawer, docked as a third column when pinned on wide screens ---------- */
.detail-panel{background:var(--panel);border-left:1px solid var(--line);position:fixed;right:0;top:0;bottom:0;width:min(460px,94vw);z-index:25;transform:translateX(104%);transition:transform .22s ease;box-shadow:var(--float);visibility:hidden;overflow:auto;display:flex;flex-direction:column;scrollbar-width:thin;scrollbar-color:var(--line2) transparent}
body.detail .detail-panel{transform:none;visibility:visible}
.dscrim{display:none}
body.detail .dscrim{display:block;position:fixed;inset:0;background:rgba(10,12,12,.22);z-index:22}
.only-narrow{display:grid!important}
.pinbtn{display:none!important}
@media(min-width:1440px){
  .pinbtn{display:grid!important}
  body.pinned .app{grid-template-columns:var(--side) minmax(0,1fr) var(--detail)}
  body.pinned .detail-panel{position:sticky;top:0;height:100vh;width:auto;transform:none;visibility:visible;box-shadow:none}

const COUNTRY_NAME=Object.fromEntries(COUNTRIES.map(c=>[c[0],c[1]]));
Object.assign(COUNTRY_NAME,{WW:"🌍 全球远程（不限地区）",EU:"欧洲（区域）",XX:"未标注地区"});
const US_STATE=/,\s*(?:AL|AK|AZ|AR|CA|CO|CT|DE|FL|GA|HI|ID|IL|IN|IA|KS|KY|LA|ME|MD|MA|MI|MN|MS|MO|MT|NE|NV|NH|NJ|NM|NY|NC|ND|OH|OK|OR|PA|RI|SC|SD|TN|TX|UT|VT|VA|WA|WV|WI|WY|DC)\b/;
function countryOf(j){
  if(j._cn)return j._cn;
  const find=t=>{const out=[];if(!t)return out;for(const [c,,re] of COUNTRIES)if(re.test(t))out.push(c);if(!out.includes("US")&&US_STATE.test(t))out.push("US");return out};
  let cs=find(j.location);
  if(!cs.length)cs=find(j.title);                       // "Developer (Remote, Brazil)", "日本橫濱 前端工程師"
  if(!cs.length&&/europe|emea|\beu\b|欧洲/i.test(j.location||""))cs=["EU"];
  if(!cs.length)cs=[globalRemote(j)||/^\s*(remote|remoto|work remotely|anywhere|worldwide|global)\b/i.test(j.location||"")?"WW":"XX"];
  return j._cn=cs;
}

/* ---------- filtering ---------- */
let _pq={q:null,v:null};
function parseQuery(q){   // space = AND, a|b = OR, -term = exclude, "exact phrase"
  if(_pq.q===q)return _pq.v;
  const must=[],not=[];
  for(const m of q.matchAll(/(-?)"([^"]+)"|(-?)(\S+)/g)){
    const neg=(m[1]||m[3])==="-",raw=(m[2]??m[4]).toLowerCase();
    const alts=raw.split("|").map(x=>x.trim()).filter(Boolean);
    if(alts.length)(neg?not:must).push(alts);
  }
  _pq={q,v:{must,not}};return _pq.v;
}
const hay=j=>j._hay??(j._hay=(j.title+" "+(j.company||"")+" "+j.text+" "+j.sources.map(x=>x.chat).join(" ")+" "+JSON.stringify(j.contacts)).toLowerCase());
// Posted time. Some sources only give a day (stored as 00:00 UTC): treat that as "some time that day" and show just the date.
const dateOnly=j=>/T00:00:00(\+00:00|Z)$/.test(j.posted_at||"");
const pt=j=>j._pt??=(()=>{const t=utc(j.posted_at).getTime();return dateOnly(j)?Math.min(t+864e5-1,Date.now()):t})();
const dayKey=j=>j._dk??=(dateOnly(j)?String(j.posted_at).slice(0,10):new Date(pt(j)).toLocaleDateString("sv-SE"));   // YYYY-MM-DD in the viewer's timezone
const whenText=j=>dateOnly(j)?utc(j.posted_at).toLocaleDateString([],{timeZone:"UTC",month:"numeric",day:"numeric"})+" 发布":ago(utc(j.posted_at));
// "global remote": remote, not restricted to a region, and not tied to a city ("Remote", "Anywhere", or no location at all)
const globalRemote=j=>j.remote&&j.geo!=="restricted"&&(j.geo==="worldwide"||!j.location||/^\s*(remote|anywhere|worldwide|global|distributed|work from anywhere)\b/i.test(j.location));
function match(j,s,skip){
  if(j.score<s.min)return false;
  if(s.since&&pt(j)<Date.now()-SINCE_MS[s.since])return false;
  if(skip!=="status"&&(s.status==="all"?j.status==="ignored":j.status!==s.status))return false;
  if(s.roles.length&&!j.tags.some(t=>has(s.roles,t)))return false;
  if(skip!=="srcs"&&s.offSrcs.length&&!j.sources.some(x=>!has(s.offSrcs,x.chat)))return false;
  if(skip!=="countries"&&s.offCountries.length&&!countryOf(j).some(c=>!has(s.offCountries,c)))return false;
  if(s.remote&&!j.remote)return false;
  if(s.hideRisk&&j.risks.length)return false;
  if(s.hideGeo&&!globalRemote(j))return false;
  if(s.visa&&j.visa!=="yes")return false;
  const q=s.q.trim();
  if(q){const {must,not}=parseQuery(q),h=hay(j);
    if(!must.every(alts=>alts.some(a=>h.includes(a)))||not.some(alts=>alts.some(a=>h.includes(a))))return false}
  return true;
}
const filtered=(skip)=>jobs.filter(j=>match(j,S,skip));
function sorted(list){
  const by=S.sort==="new"?(a,b)=>pt(b)-pt(a):(a,b)=>b.score-a.score||pt(b)-pt(a);
  return list.slice().sort(by);
}

const LINK_RE=/(https?:\/\/(?:(?!&quot;|&#39;|&lt;|&gt;)[^\s<>"')\]】])+)|([\w.+-]+@[\w-]+(?:\.[\w-]+)+)|(^|[\s(（:：>])@([A-Za-z][A-Za-z0-9_]{4,31})/g;
function linkify(text){   // escape first, then link in ONE pass so URLs/emails never get linked twice
  return esc(text).replace(LINK_RE,(m,url,mail,pre,h)=>url?`<a href="${url}" target="_blank" rel="noopener">${url}</a>`
    :mail?`<a href="mailto:${mail}">${mail}</a>`:`${pre}<a href="https://t.me/${h}" target="_blank" rel="noopener">@${h}</a>`);
}
function originalText(j){   // job sites: drop the 3 header lines we prepended (title / company line / tags)

async function setStatus(id,status,withUndo=true){
  const j=jobs.find(x=>x.id===id);if(!j||j.status===status)return;
  const old=j.status;j.status=status;
  const r=await fetch(`/api/jobs/${id}/status`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({status})}).catch(()=>({ok:false}));
  if(!r.ok){j.status=old;render();toast("保存失败，请重试");return}
  render();
  const l=(STATUS.find(s=>s[0]===status)||[0,status])[1];
  if(withUndo)toast(`已标记为「${l}」`,"撤销",()=>setStatus(id,old,false));

function nextRunText(m,next){
  if(!m)return"自动刷新：关闭";
  const lbl=m%60===0?`${m/60} 小时`:`${m} 分钟`;
  if(!next||next*1000<Date.now())return`自动刷新：每 ${lbl} · 即将开始`;
  return`自动刷新：每 ${lbl} · 下次 ${new Date(next*1000).toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"})}`;
}

async function refresh(){

/* The filters live in the address (#q=flutter&r=ios,android&min=5&since=7d&remote=1&visa=1): a search can be shared or bookmarked. */
const SHARE_KEYS=[["q","q","s"],["roles","r","a"],["offSrcs","xsrc","a"],["offCountries","xc","a"],["min","min","n"],["since","since","s"],["sort","sort","s"],["remote","remote","b"],["hideGeo","geo","b"],["visa","visa","b"],["hideRisk","risk","b"]];
function hashOf(){
  const p=new URLSearchParams();
  for(const [k,n,t] of SHARE_KEYS){const v=S[k];if(JSON.stringify(v)===JSON.stringify(DEF[k]))continue;p.set(n,t==="a"?v.join(","):t==="b"?"1":v)}
  return p.toString()?"#"+p.toString():"";
}
function readHash(){
  const h=location.hash.replace(/^#\??/,"");if(!h)return;
  const p=new URLSearchParams(h);if(![...p.keys()].some(n=>SHARE_KEYS.some(x=>x[1]===n)))return;
  Object.assign(S,{q:"",roles:[],offSrcs:[],offCountries:[],min:DEF.min,since:"",sort:"score",remote:false,hideGeo:false,visa:false,hideRisk:false});
  for(const [k,n,t] of SHARE_KEYS){if(!p.has(n))continue;const v=p.get(n);
    S[k]=t==="a"?v.split(",").filter(Boolean):t==="b"?v==="1":t==="n"?(+v||DEF[k]):v}
  if(!SINCE_MS[S.since])S.since="";if(!SORTS.some(x=>x[0]===S.sort))S.sort="score";
}

    if(e.target.closest("select,summary,input,label"))return;
    const c=e.target.closest(".card");if(c)openDetail(+c.dataset.id);
    return;
  }
  const d=t.dataset;
  if(d.s){S.status=d.s;return change()}
  if(d.m){S.min=+d.m;return change()}
  if(d.since!==undefined){S.since=d.since;return change()}
  if(d.r){S.roles=toggle(S.roles,d.r);return change()}
  if(d.rolesmore!==undefined){rolesOpen=!rolesOpen;return renderSide()}
  if(d.share!==undefined){return shareLink()}
  if(d.sort){S.sort=d.sort;return change()}
  if(d.src){S.offSrcs=toggle(S.offSrcs,d.src);return change()}
  if(d.country){S.offCountries=toggle(S.offCountries,d.country);return change()}
  if(d.countriesmore!==undefined){countriesOpen=!countriesOpen;return renderSide()}
  if(d.sqsave!==undefined){const q=S.q.trim(),name=($("#sqname")?.value||q).trim()||q;return saveSearches([...(SET.saved_searches||[]),{name,q}])}
  if(d.closeset!==undefined){$("#settings").classList.remove("show");return}
  if(d.fold){const cur=d.fold==="countries"?S.closed.countries!==false:!!S.closed[d.fold];S.closed={...S.closed,[d.fold]:!cur};save();return renderSide()}   // the country list is folded unless explicitly opened
  if(d.grp){
    const names=kindNames(d.grp);
    const allOn=names.every(n=>!has(S.offSrcs,n));S.offSrcs=allOn?[...new Set([...S.offSrcs,...names])]:S.offSrcs.filter(n=>!names.includes(n));return change()}
  if(d.clear){S[d.clear]=[];return change()}
  if(d.clearall!==undefined){Object.assign(S,{q:"",since:"",roles:[],offSrcs:[],offCountries:[],remote:false,hideRisk:false,hideGeo:false,visa:false});$("#q").value="";return change()}
  if(d.rm){const k=d.rm;
    if(k==="q"){S.q="";$("#q").value=""}else if(k==="since")S.since="";else if(k.startsWith("role:"))S.roles=S.roles.filter(x=>x!==k.slice(5));
    else if(k.startsWith("grp:")){const ns=kindNames(k.slice(4));S.offSrcs=S.offSrcs.filter(x=>!ns.includes(x))}
    else if(k.startsWith("country:"))S.offCountries=S.offCountries.filter(x=>x!==k.slice(8));
    else if(k.startsWith("src:"))S.offSrcs=S.offSrcs.filter(x=>x!==k.slice(4));else if(k==="remote")S.remote=false;else if(k==="risk")S.hideRisk=false;else if(k==="geo")S.hideGeo=false;else if(k==="visa")S.visa=false;
    return change()}
  if(d.more!==undefined){limit+=PAGE;return renderList()}
  if(d.copy){navigator.clipboard?.writeText(d.copy);return toast("已复制 "+d.copy)}
  if(d.st){return setStatus(+t.closest("[data-id]").dataset.id,d.st)}
  if(d.closedetail!==undefined)return closeDetail();
  if(d.pin!==undefined){S.pin=!S.pin;save();applyPin();if(!S.pin&&sel)document.body.classList.add("detail");return renderDetail(true)}
  if(d.nav){const i=view.findIndex(x=>x.id===sel),n=view[Math.max(0,Math.min(view.length-1,i+ +d.nav))];if(n){if(view.indexOf(n)>=limit){limit=view.indexOf(n)+PAGE;renderList()}setSel(n.id)}return}
  if(d.copytext!==undefined){const j=jobs.find(x=>x.id===sel);if(j){navigator.clipboard?.writeText(originalText(j));toast("已复制原文")}return}
  if(e.target.closest("select,summary,input,label"))return;
  const card=e.target.closest(".card");if(card)openDetail(+card.dataset.id);
});
document.addEventListener("click",e=>{
  const t=e.target.closest("#settings button,#settings [data-tpl]");if(!t)return;const d=t.dataset;
  if(d.tpl!==undefined){const [n,k,w]=TEMPLATES[+d.tpl];roleEdit=null;$("#rName").value=n;$("#rKw").value=k;$("#rW").value=w;$("#rName").focus();return}
  if(d.roleedit){roleEdit=+d.roleedit;roleErr="";return renderSettings()}
  if(d.rolecancel!==undefined){roleEdit=null;roleErr="";return renderSettings()}
  if(d.roledel){const r=ROLE_FULL.find(x=>x.id===+d.roledel);if(r&&confirm(`删除岗位「${r.label}」？已有岗位会按剩余规则重新打分。`))roleCall("DELETE",`/api/roles/${r.id}`);return}
  if(d.rolesave!==undefined){const body={label:$("#rName").value,keywords:$("#rKw").value,weight:+$("#rW").value};return roleCall(roleEdit?"PUT":"POST",roleEdit?`/api/roles/${roleEdit}`:"/api/roles",body)}
});
document.addEventListener("change",e=>{
  const id=e.target.id;
  if(id==="setRefresh"){const v=e.target.value;if(v==="custom"){$("#customWrap").hidden=false;$("#setCustom").focus()}else saveSetting({refresh_minutes:+v},$("#refErr"));return}
  if(id==="setCustom"){return saveSetting({refresh_minutes:+e.target.value},$("#refErr"))}
  if(id==="setDigest"||id==="setDigestTime"){return saveSetting({digest_enabled:$("#setDigest").checked,digest_time:$("#setDigestTime").value||"09:00"})}
  if(e.target.dataset?.roleon){return roleCall("PUT",`/api/roles/${e.target.dataset.roleon}`,{enabled:e.target.checked})}
});
document.addEventListener("change",e=>{
  if(e.target.matches("[data-sel]"))return setStatus(+e.target.closest(".card").dataset.id,e.target.value);
  if(e.target.id==="fRemote"){S.remote=e.target.checked;change()}
  if(e.target.id==="fRisk"){S.hideRisk=e.target.checked;change()}
  if(e.target.id==="fGeo"){S.hideGeo=e.target.checked;change()}
  if(e.target.id==="fVisa"){S.visa=e.target.checked;change()}
});
document.addEventListener("keydown",e=>{
  if(e.target.matches?.("[data-src],[data-country]")&&(e.key==="Enter"||e.key===" ")){e.preventDefault();return e.target.click()}
  const typing=/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName);
  if(e.key==="Escape"){$("#modal").classList.remove("show");$("#settings").classList.remove("show");document.body.classList.remove("drawer");closeDetail();if(typing)document.activeElement.blur();return}
  if(typing||e.metaKey||e.ctrlKey||e.altKey)return;
  const idx=view.findIndex(j=>j.id===sel),cur=view[idx];
  const move=n=>{const j=view[Math.max(0,Math.min(view.length-1,(idx<0?(n>0?-1:view.length):idx)+n))];if(j){if(view.indexOf(j)>=limit){limit=view.indexOf(j)+PAGE;renderList()}setSel(j.id)}};
  switch(e.key){
    case"/":e.preventDefault();$("#q").focus();break;
    case"j":move(1);break;case"k":move(-1);break;
    case"s":if(cur)setStatus(cur.id,cur.status==="interested"?"new":"interested");break;
    case"a":if(cur)setStatus(cur.id,"applied");break;
    case"x":if(cur){const nxt=view[idx+1]||view[idx-1];setStatus(cur.id,"ignored").then(()=>nxt&&setSel(nxt.id))}break;
    case"o":if(cur){const u=(cur.sources.find(s=>s.url)||{}).url||cur.contacts.links[0];if(u)window.open(u.startsWith("http")?u:"https://"+u,"_blank","noopener")}break;
    case"Enter":if(cur)openDetail(cur.id);break;
    case"r":refresh();break;
    case"b":toggleSide();break;
    case"?":$("#modal").classList.add("show");break;
  }
});
$("#q").oninput=e=>{S.q=e.target.value;change()};
$("#refresh").onclick=refresh;
$("#sideToggle").onclick=toggleSide;
$("#settingsBtn").onclick=openSettings;
$("#settings").onclick=e=>{if(e.target.id==="settings")$("#settings").classList.remove("show")};
$("#help").onclick=()=>$("#modal").classList.add("show");
$("#modal").onclick=e=>{if(e.target.id==="modal")$("#modal").classList.remove("show")};
$("#dense").onclick=()=>{S.dense=!S.dense;save();renderTabs()};
$("#theme").onclick=()=>{S.theme={auto:"light",light:"dark",dark:"auto"}[S.theme];applyTheme();save();toast("主题："+{auto:"跟随系统",light:"浅色",dark:"深色"}[S.theme])};
$("#openSide").onclick=()=>document.body.classList.add("drawer");
$("#scrim").onclick=()=>document.body.classList.remove("drawer");
$("#dscrim").onclick=closeDetail;
new IntersectionObserver(es=>{if(es[0].isIntersecting&&loaded&&view.length>limit){limit+=PAGE;renderList()}},{rootMargin:"600px"}).observe($("#sentinel"));
readHash();applyPin();$("#q").value=S.q;applyTheme();applySide();renderTabs();renderList();renderDetail();
load().catch(()=>{loaded=true;$("#list").innerHTML='<div class="empty"><b>加载失败</b>看板服务没有响应，请确认 jobboard serve 仍在运行。</div>'});
setInterval(()=>fetch("/api/sync").then(r=>r.json()).then(setSync).catch(()=>{}),60000);
</script>
</body></html>
