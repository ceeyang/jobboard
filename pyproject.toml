[project]
name = "jobboard"
version = "0.1.0"
description = "Telegram job-channel aggregator: fetch, dedupe, rank, web board, daily digest"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.110", "uvicorn>=0.29", "jinja2>=3.1", "python-multipart>=0.0.9", "cli-anything-telegram"]

[tool.uv.sources]
cli-anything-telegram = { path = "../telegram/agent-harness", editable = true }

[project.scripts]
jobboard = "jobboard.cli:main"

[dependency-groups]
dev = ["pytest>=7", "httpx>=0.27"]

[tool.setuptools]
packages = ["jobboard"]
package-data = { jobboard = ["templates/*.html"] }

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
