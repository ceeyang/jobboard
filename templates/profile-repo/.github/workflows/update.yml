name: update

# Rebuilds this site from the aggregate feed. It runs on GitHub's schedule, which is BEST EFFORT: GitHub decides when a
# scheduled workflow actually starts, and lately that is every 4-8 hours, not every hour (the cron
# below only says "as often as you are willing"). Press "Run workflow" on the Actions tab for an immediate refresh.
on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

concurrency:
  group: update
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

env:
  ENGINE_REPO: __ENGINE_REPO__          # the repository that holds the jobboard code
  FEED_URL: __FEED_URL__                # where the aggregate site publishes its data files
  JOBBOARD_SITE_URL: __SITE_URL__       # this site's own address (absolute links in its RSS feed)

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262          # v4.4.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262          # v4.4.0
        with:
          repository: ${{ env.ENGINE_REPO }}
          path: engine
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065      # v5.6.0
        with:
          python-version: "3.12"
      # Standard library only: nothing to install.
      - name: Build the site from the feed with this profile
        env:
          PYTHONPATH: ${{ github.workspace }}/engine
        run: |
          set -o pipefail
          python -m jobboard.cli build --feed "$FEED_URL" --profile config/profile.json --out site | tee build.json
      - name: Summary
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          m = json.load(open("build.json"))
          print(f"### {m['jobs']} jobs for this profile (from {m['feed']['jobs']} in the feed)")
          print(f"Data is as fresh as the aggregate site: {m['generated_at']}")
          PY
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa   # v3.0.1
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e        # v4.0.5
